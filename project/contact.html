<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Guely Studio to ask about personalized handmade bookbinding and embroidery.">

    <title>Guely Studio | Contact</title>
    <link rel="stylesheet" href="styles/site.css">
    <script src="scripts/site.js" defer></script>
</head>

<body>

    <header>
        <h1>Contact</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        
        <p>
            Have a question or want to request a custom design?
            Complete this demonstration form to see how it works.
            Your information will be saved only in this browser.
        </p>
        
        <form id="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required autocomplete="name">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="product-interest">Product Interest:</label>
                <select id="product-interest" name="product-interest" required>
                    <option value="">Select a product...</option>
                    <option value="book-cover">Embroidered Book Cover</option>
                    <option value="notebook">Handmade Notebook</option>
                    <option value="planner">Custom Planner</option>
                    <option value="other">Other / Custom Request</option>
                    <option value="leather-notebook">Genuine Leather Notebook</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="btn">Send Message</button>
        </form>
        
        <div id="form-feedback" class="feedback-message" aria-live="polite"></div>
    </main>

    <footer>
        <p>&copy; 2026 Guely Studio</p>
        <a href="references.html">References</a>
    </footer>
</body>

</html>
